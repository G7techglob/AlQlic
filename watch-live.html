
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>AlQlic Live</title>

    <link rel="stylesheet" href="watch-live.css">

</head>

<body>

<main class="live-screen">

    <!-- FULL-SCREEN LIVE VIDEO -->

    <video
        id="remoteVideo"
        autoplay
        playsinline
    ></video>

    <!-- DARK VIDEO OVERLAY -->

    <div class="video-shade"></div>

    <!-- TOP INFORMATION -->

    <header class="watch-header">

        <button
            id="backBtn"
            type="button"
        >
            ←
        </button>

        <div class="live-top-info">

            <div class="live-host-info" id="hostInfo">
                Live Host
            </div>

            <div id="streamTitle">
                Live Stream
            </div>

        </div>

        <div class="live-statistics">

            <span class="live-label">LIVE</span>

            <span class="viewer-total">
                👁 <span id="viewerCount">0</span>
            </span>

        </div>

    </header>

    <!-- COMMENTS OVER VIDEO -->

    <div
        id="liveCommentsOverlay"
        class="live-comments-overlay"
    ></div>

    <!-- FLOATING HEARTS -->

    <div
        id="liveLikesOverlay"
        class="live-likes-overlay"
    ></div>

    <!-- FLOATING GIFTS -->

    <div
        id="liveGiftsOverlay"
        class="live-gifts-overlay"
    ></div>

    <!-- BOTTOM CONTROLS -->

    <section class="live-bottom-panel">

        <div class="stream-info">

            <h2 id="title">Loading...</h2>

        </div>

        <section class="live-chat">

            <div
                id="chatMessages"
                class="chat-messages"
            ></div>

            <div class="chat-input">

                <input
                    id="chatInput"
                    type="text"
                    placeholder="Say something..."
                >

                <button
                    id="sendChatBtn"
                    type="button"
                >
                    Send
                </button>

            </div>

        </section>

        <div class="stream-actions">

            <button id="likeBtn" type="button">
                ❤️ <span id="likeCount">0</span>
            </button>

            <button id="giftBtn" type="button">
                🎁
            </button>

            <button id="shareBtn" type="button">
                📤
            </button>

        </div>

    </section>

</main>

<script
    type="module"
    src="watch-live.js"
></script>

</body>

</html>
