
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Go Live</title>

    <link
        rel="stylesheet"
        href="create-live.css"
    >

</head>

<body>

<div class="create-live-container">

    <header>

        <button
            type="button"
            onclick="window.location.href='stream.html'"
        >
            ←
        </button>

        <h2>Go Live</h2>

    </header>

    <!-- FULLSCREEN CAMERA -->

    <video
        id="cameraPreview"
        autoplay
        muted
        playsinline
    ></video>

    <!-- STREAM TITLE -->

    <input
        id="liveTitle"
        type="text"
        placeholder="What are you streaming?"
        maxlength="100"
    >

    <!-- START LIVE -->

    <button
        id="startLiveBtn"
        class="start-live-btn"
        type="button"
    >
        🔴 Start Live
    </button>

</div>

<script
    type="module"
    src="create-live.js"
></script>

</body>

</html>
