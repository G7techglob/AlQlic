<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Videos - MatchConnect</title>
  <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  
<link rel="stylesheet" href="navbar.css">
<link rel="stylesheet" href="videos.css">
  
</head>

<body>


<header class="video-header">

  <button
    type="button"
    class="video-back-btn"
    onclick="window.location.href='index.html'"
    aria-label="Go to home"
    title="Home"
>
    <i class="fas fa-arrow-left"></i>
</button>

    <h2 id="videoTitle">Latest Videos</h2>

    <div class="header-actions">

        <div class="video-search-box" id="videoSearchBox">

            <input
                type="text"
                id="videoSearchInput"
                placeholder="Search videos..."
            >

        </div>

        <button
            type="button"
            id="videoSearchBtn"
            class="header-btn"
            aria-label="Search videos"
        >
            <i class="fas fa-search"></i>
        </button>

        <button
            type="button"
            id="closeVideoSearch"
            class="header-btn"
            style="display:none;"
            aria-label="Close search"
        >
            <i class="fas fa-times"></i>
        </button>

        <a href="stream.html" class="live-btn" title="Live">
            <span class="live-dot">🔴</span>
            <span class="live-text">LIVE</span>
        </a>

    </div>

</header>


  <main id="videoFeed"></main>

  <div id="navbar-container"></div>
<script src="navbar.js"></script>
  <script type="module" src="videos.js"></script>

</body>
</html>
