<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifications</title>
  <link rel="stylesheet" href="notifications.css">
</head>
<body>

  <div class="notifications-container">

  <div class="notifications-header">
    <button class="notification-back-btn" onclick="window.location.href='index.html'" type="button">
    ←
</button>

<button class="notification-settings-btn" onclick="window.location.href='notification-settings.html'" type="button">
    ⚙
</button>

  <h2>Notifications</h2>

<div class="notification-search-box active" id="notificationSearchBox">
    <input

      id="notificationSearchInput"

  <button class="mark-read-btn">
    Mark all read
  </button>

</div>

    <div id="notificationsContainer">

    </div>

  </div>

</html>
