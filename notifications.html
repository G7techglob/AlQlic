<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifications</title>
  <link rel="stylesheet" href="notifications.css">
</head>
<body>

  <div class="notifications-container">

  <div class="notifications-header">

  <h2>Notifications</h2>

  <div class="notification-search-box" id="notificationSearchBox">
    <input
      type="text"
      id="notificationSearchInput"
      placeholder="Search notifications..."
    >
  </div>

  <button class="notification-search-btn" id="notificationSearchBtn" type="button">
    🔍
  </button>

  <button class="notification-close-search" id="closeNotificationSearch" type="button" style="display:none;">
    ✕
  </button>

  <button class="mark-read-btn">
    Mark all read
  </button>

</div>

    <div id="notificationsContainer">
      Loading...
    </div>

  </div>


  <script type="module" src="notifications.js"></script>
  <script type="module" src="theme.js"></script>

</body>
</html>
