
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AlQlic Streaming</title>

    <link rel="stylesheet" href="stream.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body>

<header class="stream-header">

    <div class="stream-header-top">

        <button
            class="back-btn"
            onclick="location.href='videos.html'"
            type="button"
        >
            <i class="fa-solid fa-arrow-left"></i>
        </button>

        <h2>Streaming</h2>

        <button
            class="go-live-btn"
            onclick="location.href='create-live.html'"
            type="button"
        >
            <i class="fa-solid fa-video"></i>
            Go Live
        </button>

    </div>

    <!-- SEARCH BOX IN HEADER -->

    <div class="stream-search">

        <i class="fa-solid fa-search"></i>

        <input
            type="text"
            id="streamSearch"
            placeholder="Search live streamers..."
            autocomplete="off"
        >

        <button
            id="clearStreamSearch"
            type="button"
            aria-label="Clear search"
        >
            <i class="fa-solid fa-times"></i>
        </button>

    </div>

</header>


<main class="stream-container">

    <section class="stream-tabs">

        <button class="stream-tab active" id="liveTab">

            <i class="fa-solid fa-tower-broadcast"></i>
            Live

        </button>

        <button class="stream-tab" id="videoTab">

            <i class="fa-solid fa-play"></i>
            Videos

        </button>

    </section>


    <!-- LIVE STREAMS -->

    <section id="liveSection">

        <h3>Live Now</h3>

       <div id="liveStreams" class="live-stream-feed"></div>

        <p id="noLiveStreams" class="empty-message">
            Nobody is live right now.
        </p>

    </section>


    <!-- SAVED VIDEOS -->

    <section id="videoSection" style="display:none;">

        <h3>Videos</h3>

        <div id="videoFeed" class="video-grid"></div>

    </section>

</main>


<script type="module" src="stream.js"></script>

</body>
</html>
