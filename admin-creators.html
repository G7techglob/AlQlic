<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Creator Applications - AlQlic Admin</title>

    <link rel="stylesheet" href="admin-creators.css">
</head>

<body>

    <main class="admin-container">

        <div class="admin-header">
            <div>
                <h1>Creator Applications</h1>
                <p>Review and manage AlQlic creator applications.</p>
            </div>

            <a href="settings.html" class="back-button">← Back</a>
        </div>

        <!-- Loading message -->
        <div id="loadingMessage" class="message">
            Loading creator applications...
        </div>

        <!-- Access denied message -->
        <div id="accessDenied" class="message error-message" style="display: none;">
            Access denied. This page is for AlQlic administrators only.
        </div>

        <!-- Applications -->
        <section id="applicationsContainer" class="applications-container">
            <!-- Creator applications will appear here -->
        </section>

    </main>

    <script type="module" src="admin-creators.js"></script>

</body>
</html>
