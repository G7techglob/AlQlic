<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Register - AlQlic</title>

<link rel="stylesheet" href="register.css">

</head>

<body>

<div class="box">

    <h2>Create Your AlQlic Account</h2>

    <input
        type="text"
        id="registerName"
        placeholder="Full Name or Username"
    >

    <input
        type="email"
        id="registerEmail"
        placeholder="Email"
    >

    <!-- Password -->
    <div class="password-container">

        <input
            type="password"
            id="registerPassword"
            placeholder="Password"
        >

        <button
            type="button"
            id="togglePassword"
            class="toggle-password"
            aria-label="Show password"
        >
            👁
        </button>

    </div>


    <!-- Confirm Password -->
    <div class="password-container">

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm Password"
        >

        <button
            type="button"
            id="toggleConfirmPassword"
            class="toggle-password"
            aria-label="Show confirm password"
        >
            👁
        </button>

    </div>


    <button id="registerBtn">
        Create Account
    </button>

    <p>
        <a href="login.html">
            Already have an account?
        </a>
    </p>

</div>

<script type="module" src="register.js"></script>

</body>
</html>
