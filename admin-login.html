<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AlQlic Admin Login</title>

    <link
        rel="stylesheet"
        href="admin-login.css"
    >
</head>

<body>

    <main class="admin-login-container">

        <div class="admin-login-card">

            <h1>AlQlic Admin</h1>

            <p class="login-description">
                Sign in to access the administrator area.
            </p>

            <form id="adminLoginForm">

                <label for="adminEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="adminEmail"
                    placeholder="Enter administrator email"
                    required
                >

                <label for="adminPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Enter password"
                    required
                >

                <button type="submit">
                    Sign In
                </button>

            </form>

            <p
                id="loginMessage"
                class="login-message"
            ></p>

        </div>

    </main>

    <script
        type="module"
        src="admin-login.js"
    ></script>

</body>
</html>
